name: React build

on:
  push:
    paths:
      - 'react/**'
      - '.github/workflows/react-build.yml'
  pull_request:
    paths:
      - 'react/**'
      - '.github/workflows/react-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react/package-lock.json
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
